name: invest-agent

# 準點由網站（src/api/scheduler.py）以 workflow_dispatch＋scheduled 觸發；cron 只當備援（GitHub cron 常延遲數小時）。
# 兩者都先經過 gate（src/schedule.py）：過了有效時間或同一時段已完成就略過。
# gate 放在安裝字型與套件之前，重複觸發被略過時只花約 1 分鐘（2026-10-20：私人 repo 每月 2,000 分鐘額度用完）。
# 盤中建議不設 cron 備援：GitHub cron 常延遲到收盤後，gate 幾乎都會略過，只是白花分鐘數。
on:
  schedule:
    - cron: "0 23 * * 0-4"   # 台灣 07:00（週一～週五）盤前報告
    - cron: "20 0 * * 1-5"   # 台灣 08:20 開盤前更新
    - cron: "45 7 * * 1-5"   # 台灣 15:45 盤後檢討＋隔日預掛單
    - cron: "30 8 * * 5"     # 台灣週五 16:30 週報
  workflow_dispatch:
    inputs:
      mode:
        description: 執行模式
        type: choice
        options: [premarket, preopen, intraday, postclose, weekly, tune, record]
        default: premarket
      force:
        description: 非交易日也執行
        type: boolean
        default: false
      dry_run:
        description: 測試模式（Email 主旨加［測試］、不寫預測紀錄與總資產、不提交任何檔案）
        type: boolean
        default: false
      rollback:
        description: "[tune] 回復上一次調整前的參數"
        type: boolean
        default: false
      code:
        description: "[record] 股票代號"
        required: false
      side:
        description: "[record] BUY / SELL"
        required: false
      shares:
        description: "[record] 股數（1 張 = 1000）"
        required: false
      price:
        description: "[record] 成交價"
        required: false
      margin:
        description: "[record] 融資"
        type: boolean
        default: false
      scheduled:
        description: 排程觸發（過了有效時間或同一時段已完成就略過）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: invest-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 上傳網站用的市場快照到 Release（src/snapshot.py）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Decide mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * 0-4") echo "mode=premarket" >> "$GITHUB_OUTPUT" ;;
            "20 0 * * 1-5") echo "mode=preopen" >> "$GITHUB_OUTPUT" ;;
            "45 7 * * 1-5") echo "mode=postclose" >> "$GITHUB_OUTPUT" ;;
            "30 8 * * 5")   echo "mode=weekly" >> "$GITHUB_OUTPUT" ;;
            *)              echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; then
            pip install -q pyyaml   # gate 只需要 src/config.py 的 yaml
            python -m src.schedule gate "${{ steps.mode.outputs.mode }}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # 順便喚醒網站（取代已移除的 keepalive.yml；網站本身也會每 6 小時自我造訪）
      - name: Wake website
        run: curl -s -m 20 -o /dev/null https://avad8-xq.hf.space/api/status || true
      - name: Restore market data cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: market-${{ github.run_id }}
          restore-keys: market-
      - name: Install CJK fonts
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install requirements
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Run
        if: steps.gate.outputs.run == 'true'
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "record" ]; then
            ARGS="--code ${{ inputs.code }} --side ${{ inputs.side }} --shares ${{ inputs.shares }} --price ${{ inputs.price }}"
            [ "${{ inputs.margin }}" = "true" ] && ARGS="$ARGS --margin"
            python -m src.main record $ARGS
          elif [ "$MODE" = "tune" ]; then
            if [ "${{ inputs.rollback }}" = "true" ]; then python -m src.main tune --rollback; else python -m src.main tune; fi
          else
            FORCE=""
            [ "${{ inputs.force }}" = "true" ] && FORCE="--force"
            python -m src.main "$MODE" $FORCE
          fi
      - name: Mark slot done
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.key != ''
        run: python -m src.schedule mark "${{ steps.gate.outputs.key }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: reports-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            reports/**/*.docx
            reports/**/*.pptx
            reports/**/*.csv
          if-no-files-found: ignore
      - name: Commit state and reports
        if: ${{ !inputs.dry_run && steps.gate.outputs.run == 'true' }}
        run: |
          git config user.name "invest-agent-bot"
          git config user.email "invest-agent-bot@users.noreply.github.com"
          for f in data/trades.csv data/position_meta.json data/nav_history.json data/pending_orders.json \
                   data/prediction_log.csv data/tuning_log.json data/schedule_log.json data/forum_log.csv data/fin_reports.csv data/presentation.json config/learned_params.yaml data/strategy data/facts data/intraday reports; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "chore: ${{ steps.mode.outputs.mode }} $(date +%F)" && git pull --rebase && git push)
      - name: Notify on failure
        if: failure()
        run: python scripts/notify_failure.py "invest-agent" "${{ steps.mode.outputs.mode }}"
