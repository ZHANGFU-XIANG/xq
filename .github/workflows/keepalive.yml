name: keepalive

# Hugging Face 免費 Space 連續 48 小時沒有人造訪就會休眠；每 6 小時造訪一次讓它保持清醒。
# 若 Space 已經睡著，這個請求也會把它叫醒（啟動後會自動預載資料與盤中建議）。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping Space
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s -m 30 https://avad8-xq.hf.space/api/status || true)
            echo "$body" | head -c 300; echo
            echo "$body" | grep -q '"warm":true' && exit 0
            sleep 20
          done
          echo "Space 未在時間內完成預載" && exit 1
