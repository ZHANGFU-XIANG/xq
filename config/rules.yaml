# 2026 德明X富達投資擂台 全國大專院校組模擬投資競賽 — 競賽規則
# 來源：https://sites.google.com/gs.takming.edu.tw/2026pmcxc/競賽專區/競賽規則
#       簡章與辦法 PDF（2026/07/09 版）、常見問題與規則 Q&A PDF（2026/08/30 版），2026-10-04 核對
competition:
  name: 2026 德明X富達投資擂台 全國大專院校組模擬投資競賽
  start: 2026-10-05
  end: 2026-11-27
  trading_days: 38
  build_period_end: 2026-10-16      # 建倉期：此日(含)之前不罰持股率
  symbols_check_start: 2026-10-19   # 第 3 週起每日追蹤「交易過的標的數 ≥ 5」（簡章 PDF，2026-10-04 核對）
  presentation_upload_deadline: 2026-12-16
  final_date: 2026-12-19

capital:
  initial: 10000000
  securities: 8000000
  futures: 2000000                  # 可自由出入金

instruments:
  allowed: [上市櫃股票, ETF, 大台, 小台, 微台, 台指選擇權, 股票期貨]
  forbidden: [上市櫃權證]

hours:
  securities: ["09:00", "13:30"]
  odd_lot_intraday: ["09:10", "13:30"]   # Q&A：盤中零股
  odd_lot_after: ["13:40", "14:30"]      # 盤後零股
  after_hours_fixed: ["14:00", "14:30"]  # 盤後定價
  futures: ["08:45", "13:45"]
  preorder_after: "15:30"           # 前一日 15:30 之後可預掛單

costs:
  stock_tax: 0.003                  # 含現股當沖
  etf_tax: 0.001
  commission: 0.001425
  min_commission: 20                # 每筆成交計算、無條件進位、最低 20 元（10/05 App 淨收付 7,664,805 = 價金 7,653,700 + 手續費 11,105 驗證）
  amount_rounding: floor            # 成交價金 = 股數 × 價格，元以下無條件捨去（App 成本與未實現損益依此）
  index_futures_tax: 0.00002
  options_tax: 0.0001

credit:
  margin_ratio: 0.60                # 融資成數 60%（自備 40%）
  short_margin_ratio: 0.90          # 融券保證金成數 90%

requirements:
  min_trades: 10                    # 買、賣各算一筆（Q&A：初賽期間累計 10 筆以上）
  min_symbols: 5
  symbols_rule_start: 2026-10-19    # 簡章 20(9)：「競賽開始後第三周起投資組合至少涵蓋 5 個標的物」
  min_holding_ratio: 0.70
  final_day:                        # Q&A：最後一日收盤後不可清空部位
    min_held_symbols: 5             # 必須仍持有 5 個以上不同標的
    max_cash_ratio: 0.30            # 現金必須低於總資產 30%
  liquidity_note: 嚴禁針對流動性欠佳標的進行異常交易，績效不具代表性者可被取消資格（Q&A 貳-六）
  futures_allowed: true             # Q&A：大專院校組可交易期貨（含選擇權及股票衍生性商品）

ranking_schedule:
  weekly: 每週五收盤後結算，平台公告的是「未審核」排名；簡章寫每週一公布上週五排名
  threshold_check: 交易競賽門檻檢核表於競賽最後一週公布

futures:
  count_in_holding: false           # 持股率是否計入期貨名目價值（官網未明說，先保守不算）
  contracts:
    TX: {name: 臺股期貨, multiplier: 200, margin_name: 臺股期貨}
    MTX: {name: 小型臺指, multiplier: 50, margin_name: 小型臺指}
    TMF: {name: 微型臺指期貨, multiplier: 10, margin_name: 微型臺指期貨}
    TXO: {name: 臺指選擇權, multiplier: 50}
  commission_per_contract: {TX: 80, MTX: 30, TMF: 15, TXO: 25}   # TX 80 由 10/06 App 持有現金反推（2 口費用 560 = 2 ×（80 + 期交稅 200））；其餘為假設值
  tax_rounding: ceil_per_contract   # 期交稅每口計算、無條件進位（49,875 點 × 200 × 0.002% = 199.5 → 200）

penalties:
  holding_ratio_penalty: 0.002      # 每次扣報酬率 0.2%，每日收盤評估，只算實際持股

ranking:
  only_positive_return: true
  presentation_top_n: 20
  presentation_minutes: 6
  weight_ranking: 0.5
  weight_presentation: 0.5

# 交易所休市日（競賽期間）：2026 國慶 10/10 逢週六→10/9 補假；光復節 10/25 逢週日→10/26 補假
holidays: [2026-10-09, 2026-10-26]
