llm:
  # 供應商順序：開源模型優先（NVIDIA build.nvidia.com → Groq），Gemini（閉源）只當最後備援
  providers: [nvidia, groq, gemini]
  # NVIDIA 免費開發者方案（約 40 次／分鐘，無點數制）；依序嘗試，額度用完或不支援就換下一個
  # 2026-10-04 實測（工具呼叫＋數字核對）：nemotron-3-super 最快最準；deepseek 詳細但較慢；glm 偶爾逾時
  # kimi-k2.6 帳號無權限、kimi-k3 逾時、gpt-oss-20b 會亂答，故不列入
  nvidia_models: [nvidia/nemotron-3-super-120b-a12b, deepseek-ai/deepseek-v4.1-flash, z-ai/glm-5.3-flash]
  # 依序嘗試；模型下架或過載(503)時自動換下一個，只需改這裡
  gemini_models: [gemini-3.5-flash, gemini-2.5-flash, gemini-flash-latest]
  groq_models: [openai/gpt-oss-120b, qwen/qwen3.8-27b]
  # 截圖辨識（XQ 庫存／成交回報）：順序 Gemini → NVIDIA（成交紀錄準確優先，例外於「開源優先」）。
  # 2026-10-05 用真實 XQ 成交回報（17 列）實測：gemini-2.5-flash 全對；nemotron nano omni 有 3 列成交價金讀錯；
  # gemma-4-31b、llama-3.2-90b-vision 逾時，kimi 帳號無權限
  nvidia_vision_models: [nvidia/nemotron-3-nano-omni-30b-a3b-reasoning]
  gemini_vision_models: [gemini-2.5-flash]
  temperature: 0
  min_interval_sec: 7               # 免費層速率限制（約 10 RPM）
  max_retries: 2

# ---------------------------------------------------------------- 全市場選股
universe:
  include_etf: true
  exclude_industries: [ETN, Index, 所有證券, 存託憑證, 大盤, 創新板股票]
  exclude_name_keywords: [反1, 反向, 正2, 槓桿, 期貨, 債]   # 槓桿/反向/債券/期貨 ETF 不納入模型
  prefilter_min_value: 20000000     # 最近交易日成交值 ≥ 2,000 萬才下載歷史
  min_avg_value20: 50000000         # 20 日均成交值 ≥ 5,000 萬
  min_price: 10
  history_years: 10                 # 2026-10-12 由 5 年改 10 年：樣本外 10 期（2024-03～2026-09）前 20 名 20 日 +5.97% → +6.71%、收正 53% → 57%，10 期贏 7 期

alpha:
  horizon: 20                       # 預測未來 20 個交易日（約一個月）
  horizon_long: 40                  # 穩健籃另用約 40 個交易日（到比賽結束）的收正與報酬模型
  high_window: 252                  # 「創新高」= 超過過去 252 日（52 週）最高價
  sample_every: 5                   # 每 5 日取一個樣本，降低自相關
  top_k: 20                         # 回測用：每期前 20 名
  n_folds: 4
  fold_days: 60
  candidates: 40                    # 進入深度分析（法人/營收/新聞/隔夜預測）的檔數
  hyperparams: {half_life_days: 0}   # 2026-10-12 搭配 10 年資料改為不加權（10 年＋半衰 365 只有 +5.39%、半衰 730 +6.09%、不加權 +6.71%）

# ---------------------------------------------------------------- 攻守配置（動態）
allocation:
  base_offense: 0.8                 # 2026-10-15 重新啟用 regime 降檔（灰/紅燈防禦）；須與 regime.OFFENSE["中性"] 相同，使 tilt=0
  min_offense: 0.25
  max_offense: 1.0
  drawdown_steps: []                # 2026-10-12 取消回撤減碼（未經回測；紅燈全部出場的回測反而更差）；舊值 [[0.04, 0.10], [0.08, 0.20]]
  late_days: 15                     # 剩餘交易日 ≤ 15 時：已正報酬 → 進攻 −10% 保住晉級；仍虧損 → 進攻 +10% 爭取轉正
  etf: {base: 0.0, min: 0.0, max: 0.0}      # 2026-10-12 報酬率第一：不配置 ETF 籃（進攻前 20 名各燈號都贏全市場）；舊值 base 0.15、0.05～0.35

baskets:
  offense:
    name: 進攻籃
    max_positions: 5
    max_weight: 0.25
    allow_margin: true
    buy_threshold: 0.30
    take_profit: []   # 2026-10-12 取消分段停利：回測固定停利 +1.5% vs 抱 40 日 +17.4%，獲利改用結單轉股（全賣換股）
    anti_chase: {max_rsi: 82, max_r20: 0.45, pullback_rsi: 75}   # 超過上限不買；RSI > 75 限價等回檔
  defense:
    name: 穩健籃
    max_positions: 4
    max_weight: 0.20
    allow_margin: false
    buy_threshold: 0.20
    take_profit: []   # 2026-10-12 取消分段停利：回測固定停利 +1.5% vs 抱 40 日 +17.4%，獲利改用結單轉股（全賣換股）
    candidates: 25
    eligible: {max_rsi: 68, c_ma20: [-0.06, 0.06], max_beta: 1.1}
  etf:
    name: ETF籃
    max_positions: 3
    max_weight: 0.15
    allow_margin: false
    buy_threshold: 0.15
    take_profit: []   # 2026-10-12 取消分段停利：回測固定停利 +1.5% vs 抱 40 日 +17.4%，獲利改用結單轉股（全賣換股）
    candidates: 15
    max_per_category: 1
    max_premium_pct: 1.0             # 溢價超過 1% 不追

# 穩健籃評分權重
# 2026-10-05 加入「預期報酬」：樣本外 4 期回測（收正＋回檔 vs 收正＋回檔＋報酬）
#   20 日平均報酬 +4.52% → +6.74%（4 期全部較好）、收正率 63.1% → 65.0%、平均最大回檔 -4.66% → -5.61%
defense_weights:
  up: 0.25                          # 一個月收正報酬機率
  drawdown: 0.25                    # 預期最大回檔小
  return: 0.25                      # 預期超額報酬（40 日模型；避免選到穩但幾乎不漲的股票）
  lowvol: 0.10                      # 低波動
  institutional: 0.10               # 法人籌碼
  revenue: 0.05                     # 營收穩定成長

# 進攻籃綜合分數權重（調整 Agent 可在範圍內修改，實際值見 config/learned_params.yaml）
score_weights:
  alpha: 0.35                       # 模型預期一個月超額報酬
  newhigh: 0.20                     # 一個月內創 52 週新高機率
  institutional: 0.15               # 三大法人近 5 日買賣超
  revenue: 0.10                     # 月營收年增率
  overnight: 0.10                   # 美股 → 台股隔夜預測
  sentiment: 0.10                   # 個股新聞

strategy:
  style: aggressive
  target_holding_ratio: 0.90        # 目標持股率（規則下限 70%，保留緩衝）
  max_holding_ratio: 1.00           # 持股率上限（>100% 代表使用融資槓桿）
  max_positions: 5                  # 2026-10-12 報酬率第一：集中 5 檔（十年模擬年化中位 90%、最差 78.5%；10 檔 87%／60.6%）；競賽規定最少持有 5 檔
  min_positions: 5
  risk_per_trade: 0.015             # 每筆最大可承受虧損 = 總資產 × 1.5% × 信心係數
  max_weight: 0.25                  # 單一標的上限
  sector_max_weight: 0.50           # 單一產業上限
  liquidity_cap: 0.02               # 不超過 20 日均量 2%
  atr_mult_stop: 2.0
  max_stop_pct: 0.10
  sell_score_threshold: -0.30
  swap_margin: 0.01                 # 換股：新標的預期報酬需高出「原標的 + 換股成本 0.585%」1%
  # 2026-10-12 十年投資組合模擬（2021-11～2026-10、10 檔、每 5 日檢查、5 種起始日 × 5/10/15 檔）：
  #   抱 40 日到期才換 年化中位 49.8%；持有 ≥10 日＋門檻 1% → 87.2%（87% 組合勝出）；
  #   再加「獲利 ≥10% 不必等 10 日、門檻 2%」→ 88.4%、最差 60.6%（採用；2022 空頭 +4.0%，單純 10 日規則 +11.2%）
  profit_swap_min_pnl: 0.10         # 獲利 ≥10%：不受 min_hold_days 限制，可當天結單轉股
  profit_swap_margin: 0.02          # 獲利結單轉股的門檻（扣成本後多 2%）
  expiry_days: 40                   # 持有滿 40 個交易日：只要換股扣成本後仍有正的預期優勢就換
  min_hold_days: 10                 # 買進後 10 個交易日內不因換股、分數轉弱、權重超標而賣出（停損、停利、跌停／負面新聞等風險警示不受限）
  allow_margin: true
  max_margin_loan_ratio: 0.30       # 融資借款上限佔總資產
  allow_odd_lot: true
  take_profit: []   # 2026-10-12 取消分段停利：回測固定停利 +1.5% vs 抱 40 日 +17.4%，獲利改用結單轉股（全賣換股）
  futures_reserve: 300000           # 期貨帳戶保留金額；其餘建議轉入證券戶以提高持股率
  etf_fillers: ["0050", "006208"]   # 持股率或標的數不足時的補位 ETF（稅 0.1%）
  limit_buffer: 0.005               # 買進限價 = 預測開盤價 × (1 + 0.5%)
  min_order_pct: 0.01               # 單筆買進金額 < 總資產 1% 不下單

predictor:
  history_years: 2
  min_hit_rate: 0.55                # 回測方向命中率低於此值則降權
  ridge_alpha: 5.0

# ---------------------------------------------------------------- 調整 Agent
tuner:
  overnight_window: 10              # 近 10 次隔夜預測
  overnight_min_hit: 0.45           # 方向命中率低於此值 → 失準
  big_miss_bands: 3.0               # 大盤跳空誤差 > 3 倍誤差帶 → 重大失誤
  alpha_min_matured: 20             # 至少 20 筆到期的月預測才評估
  allocation_min_periods: 6         # 攻守比例／因子權重至少要 6 個不重疊的一個月期間才調整（競賽期間通常不會達到 → 不亂調）
  alpha_min_excess: -0.03           # 推薦標的平均超額報酬 < -3% → 失準
  max_drawdown: 0.08                # 總資產自高點回落 > 8% → 降低風險
  big_loss_nav: 0.015               # 單一標的單日虧損 > 總資產 1.5% → 重大失誤
  def_min_up: 0.55                  # 穩健籃一個月實際收正比例下限（回測約 63～65%）
  def_max_dd: -0.07                 # 穩健籃一個月平均最大回檔警戒（回測約 -5.6%）
  def5_min_up: 0.45                 # 穩健籃推薦後 5 日收正比例警戒（早期檢查，不必等一個月）
  def5_max_dd: -0.05                # 穩健籃推薦後 5 日平均最大回檔警戒
  accept_improvement: 0.05          # 新參數需比現行回測指標進步 5% 以上才採用
  bounds:
    risk_per_trade: [0.008, 0.02]
    max_weight: [0.15, 0.25]
    atr_mult_stop: [1.5, 3.0]
    score_weight: [0.05, 0.50]

# ---------------------------------------------------------------- 新聞與國際大事
news:
  max_items: 180
  lookback_hours: 24
  rss:
    - {name: 鉅亨網台股, url: "https://news.cnyes.com/rss/v1/news/category/tw_stock"}
    - {name: 鉅亨網美股, url: "https://news.cnyes.com/rss/v1/news/category/us_stock"}
    - {name: 鉅亨網國際, url: "https://news.cnyes.com/rss/v1/news/category/wd_stock"}
    - {name: 鉅亨網外匯, url: "https://news.cnyes.com/rss/v1/news/category/forex"}
    - {name: 中央社財經, url: "https://feeds.feedburner.com/rsscna/finance"}
    - {name: Yahoo股市, url: "https://tw.stock.yahoo.com/rss?category=tw-market"}
  google_news_queries: [台股 法人, 聯準會 利率, 關稅 貿易, 油價 OPEC, 美元 台幣 匯率, 中國 經濟數據, 地緣政治 股市, 輝達 股價, ETF 配息, 台指期 外資]

# 國際因子：用來量化「國際大事 → 持股」的影響幅度（歷史敏感度 β）
macro_factors:
  US_RATES: {ticker: "^TNX", name: 美國10年債殖利率, mode: diff}
  USD_TWD: {ticker: "TWD=X", name: 美元兌台幣, mode: pct}
  OIL: {ticker: "CL=F", name: 西德州原油, mode: pct}
  US_TECH: {ticker: "^SOX", name: 費城半導體, mode: pct}
  US_MARKET: {ticker: "^GSPC", name: 標普500, mode: pct}
  CHINA: {ticker: "FXI", name: 中國大型股ETF, mode: pct}
  JAPAN: {ticker: "^N225", name: 日經225, mode: pct}
  RISK: {ticker: "^VIX", name: VIX恐慌指數, mode: pct}
  GOLD: {ticker: "GC=F", name: 黃金, mode: pct}

us_watch:
