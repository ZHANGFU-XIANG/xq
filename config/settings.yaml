# 法說會 / 財報 PDF：放在 data/pdfs/{代號}_任意名稱.pdf，或列出網址
filings:
  urls: []

email:
  enabled: true
  to: []                            # 也可用環境變數 REPORT_TO（逗號分隔）

# 期貨（台指期）方向建議與選擇權避險（只做買方）
futures:
  horizon_days: 5                   # 方向模型預測與持有天數
  p_long: 0.60                      # 上漲機率 ≥ 此值才考慮做多
  p_short: 0.40                     # 上漲機率 ≤ 此值才考慮放空
  min_backtest_trades: 20           # 樣本外交易次數下限（證據不足就不開放）
  roundtrip_cost_pct: 0.02          # 來回成本假設（稅＋手續費＋滑價，佔名目價值 %）
  atr_mult: 2.0                     # 停損 = ATR14 × 倍數
  risk_rank: 0.01                   # 衝名次：每筆風險佔總資產
  risk_recovery: 0.015              # 補回虧損
  risk_recovery_late: 0.02          # 比賽末段仍為負報酬
  risk_protect: 0.005               # 末段已是正報酬：保名次
  recovery_drawdown: 0.04
  late_days: 15
  max_margin_pct_nav: 0.06          # 期貨原始保證金上限佔總資產（確保股票＋ETF 持股率）
  margin_buffer: 2.5                # 期貨戶留存 = 保證金 × 倍數（防追繳）
  min_reserve: 300000               # 期貨戶最少留存
  roll_days: 3                      # 距結算不足天數改用次月
  hedge:
    taiex_rsi: 75
    dist_ma60_pct: 10
    vix_jump_pct: 15
    p_down: 0.60
    otm_pct: 0.04                   # 價外 4%
    hedge_ratio: 0.4                # 避險比例（股票 β 加權市值）
    premium_budget_pct: 0.005       # 權利金上限佔總資產
    min_days_to_expiry: 7
  overlay:                          # 沒有擇時優勢時「加碼大盤曝險」（明確標示非預測優勢）；條件：加權在季線上、近年一直做多平均報酬為正
    enabled: true
    risk: 0.01
    modes: [補回虧損, 衝名次]       # 2026-10-05 使用者決定操作期貨：衝名次模式也給做多建議（用期貨戶閒置資金放大報酬）；保名次不做

daytrade:                           # 當沖排行（src/agents/daytrade.py）；全部規則化，不經 LLM
  # 當沖用「真實市場」規則，不套競賽規則（使用者 2026-10-12：當沖要拿到現實使用）
  costs:
    commission: 0.001425            # 券商手續費牌告 0.1425%
    fee_discount: 1.0               # 手續費折扣（例如 6 折填 0.6、2.8 折填 0.28）
    min_fee: 20                     # 每筆最低手續費（元）
    stock_tax: 0.0015               # 現股當沖證交稅減半 0.15%（優惠延長至 2027-12-31）
    etf_tax: 0.001                  # ETF 證交稅 0.1%（無當沖減半）
  capital: null                     # 當沖資金（元）：張數與停損金額依此計算；null＝用系統帳戶總資產
  min_price: 10
  min_avg_value20: 300000000        # 20 日均成交值 ≥ 3 億（當沖要能隨時進出）
  min_atr_pct: 2.0                  # 14 日平均真實波幅 ≥ 2%（來回成本約 0.585%，波動太小賺不到）
  prefilter_n: 60                   # 先用日線分數挑前 60 檔，再抓即時報價
  top_n: 10                         # 排行榜顯示「可以當沖」的前幾名
  risk_per_trade: 0.01              # 每筆觸停損約賠當沖資金 1%
  max_notional_pct: 1.0             # 每筆部位金額上限＝當沖資金 100%（當沖只交割價差）
  stop_atr: 0.5                     # 停損距離＝0.5 倍 ATR（至少 0.8%）
  min_stop_pct: 0.8
  reward_risk: 2.0                  # 目標價＝進場價＋2 倍停損距離（遇漲停價則截在漲停前一檔）
  min_volume_ratio: 1.0             # 估計量比門檻
  open_wait_min: 0                  # 開盤後幾分鐘內不開新倉（0＝開盤就可以進）
  last_entry: "13:20"               # 這個時間後不開新倉
  flat_by: "13:25"                  # 當沖部位最晚平倉時間
  history_days: 60                  # 個股「開盤買、收盤賣」歷史統計期間
  backtest_days: 240                # 日線回測天數（約一年）
  require_edge: false               # true＝回測沒有正報酬時一律「先不要當沖」；使用者 2026-10-12 要求放開（當沖本來就有風險）

picks:                              # 高報酬推薦的買點與出場（data.high_return_picks / data.exit_plan）
  # 2026-10-12 回測（樣本外 4 期、每期前 20 名，扣來回成本）：
  # 進場：隔日開盤直接買 20 日 +8.6%；掛昨收 +6.0%、昨收−0.5ATR +4.4%、回測 5 日線 +4.1%（買不到的強勢股最會漲）
  # 出場：抱 40 日 +17.4%、抱 20 日 +8.6%；移動停利 4ATR +11.0%、3ATR +8.1%；固定停利 15%/停損 8% +1.5%；
  #       跌破 10 日線 +2.3%；排名掉出前 200 名 +9.7% → 時間出場最好；測試期為多頭年，大盤轉紅燈時提早出場
  hold_days: 40                     # 建議持有交易日數（退場日）
  review_days: 20                   # 中途檢查日
  trail_atr: 4                      # 移動停利線＝進場後最高收盤 − 4×ATR14（要鎖利時用）
  stop_atr: 2                       # 進場時的初始停損＝進場價 − 2×ATR14
